spring.application.name=Anadolu Security

# Port Config
server.port=8090

# DB Config - H2 Database
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:file:~/havelsan_2026_security;AUTO_SERVER=TRUE

# vault kurulumu: https://docs.hashicorp.com/vault/install
# vault server -dev -dev-root-token-id="dev-token"
# http://127.0.0.1:8200/

spring.application.name=demo-app

# Port Config
server.port=8090

# DB Config - H2 Database
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:file:~/havelsan_2026_security;AUTO_SERVER=TRUE
spring.datasource.username=${VAULT_DB_USERNAME}
spring.datasource.password=${VAULT_DB_PASSWORD}

# JPA Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Security Key Config
security.crypto.aes-key=${VAULT_AES_KEY}
security.crypto.hmac-key=${VAULT_AES_MAC_KEY}

# Logging Config
spring.output.ansi.enabled=ALWAYS

# Spring Cloud 2025.1.0 officially supports Boot 4.0.x only
spring.cloud.compatibility-verifier.enabled=false

# Vault Config
spring.config.import=vault://

spring.cloud.vault.uri=http://localhost:8200
spring.cloud.vault.authentication=TOKEN
spring.cloud.vault.token=${VAULT_TOKEN}

spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret